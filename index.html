<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SetTrack">
<meta name="theme-color" content="#070909">
<meta name="color-scheme" content="dark">
<meta name="description" content="Setlerini, tekrarlarını ve RIR değerlerini hızlıca kaydet.">
<title>SetTrack · Antrenman Günlüğü</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#070909;
  --bg-soft:#0D100F;
  --surface:rgba(20,24,23,.94);
  --surface-solid:#141817;
  --surface2:#1A201E;
  --surface3:#222A27;
  --line:rgba(239,247,241,.09);
  --line-strong:rgba(200,255,88,.27);
  --text:#F3F7F3;
  --muted:#98A39D;
  --accent:#C8FF58;
  --accent-ink:#101508;
  --accent-soft:rgba(200,255,88,.11);
  --r0:#FF7070;
  --r1:#FFAE62;
  --r2:#E7D660;
  --r3:#79A8FF;
  --up:#73E6AA;
  --shadow:0 18px 50px rgba(0,0,0,.32);
  --num:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --sans:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{background:var(--bg);scroll-behavior:smooth}
body{
  position:relative;
  min-height:100vh;
  overflow-x:hidden;
  background:
    radial-gradient(circle at 10% -8%,rgba(200,255,88,.13),transparent 31rem),
    radial-gradient(circle at 105% 22%,rgba(80,111,255,.10),transparent 26rem),
    linear-gradient(180deg,#080A09 0%,var(--bg) 52%);
  color:var(--text);
  font-family:var(--sans);
  font-size:16px;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  padding-top:env(safe-area-inset-top);
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  opacity:.18;
  background-image:
    linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:34px 34px;
  -webkit-mask-image:linear-gradient(to bottom,black,transparent 68%);
  mask-image:linear-gradient(to bottom,black,transparent 68%);
}
button,input,textarea{font:inherit}
button{
  color:inherit;
  background:none;
  border:0;
  cursor:pointer;
  padding:0;
  touch-action:manipulation;
}
button:focus-visible,input:focus-visible,textarea:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:3px;
}
::selection{background:var(--accent);color:var(--accent-ink)}
.muted{color:var(--muted);font-size:.8125rem}
.pad{padding:20px 16px}
svg{display:block}
#warnSlot{width:min(100%,740px);margin:0 auto}

.top{
  position:sticky;
  top:0;
  z-index:10;
  width:min(100%,740px);
  margin:0 auto;
  padding:12px 12px 11px;
  overflow:hidden;
  background:rgba(8,10,9,.88);
  border:1px solid var(--line);
  border-top:0;
  border-radius:0 0 24px 24px;
  box-shadow:0 12px 36px rgba(0,0,0,.28);
  -webkit-backdrop-filter:blur(22px) saturate(135%);
  backdrop-filter:blur(22px) saturate(135%);
}
.top::after{
  content:"";
  position:absolute;
  top:0;
  left:18%;
  right:18%;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  opacity:.75;
}
.brandRow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:1px 4px 9px;
}
.brandLockup{display:flex;align-items:center;gap:9px;min-width:0}
.brandMark{
  width:34px;
  height:34px;
  flex:none;
  display:grid;
  place-items:center;
  border-radius:10px 10px 10px 3px;
  background:var(--accent);
  color:var(--accent-ink);
  box-shadow:0 8px 24px rgba(200,255,88,.18);
  font-family:var(--num);
  font-size:1.05rem;
  font-weight:700;
  letter-spacing:.03em;
}
.brandText{display:flex;flex-direction:column;min-width:0}
.brandText strong{
  font-size:.94rem;
  line-height:1.05;
  letter-spacing:.02em;
}
.brandTools{display:flex;align-items:center;gap:7px}
.brandTools .iconBtn{width:32px;height:32px}
.nav{
  display:grid;
  grid-template-columns:44px minmax(0,1fr) 44px;
  align-items:center;
  gap:6px;
  padding:5px;
  background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.025));
  border:1px solid var(--line);
  border-radius:17px;
}
.arrow{
  width:44px;
  height:44px;
  display:grid;
  place-items:center;
  border-radius:13px;
  color:var(--muted);
  transition:background .16s ease,color .16s ease,transform .16s ease;
}
.arrow svg{width:21px;height:21px}
.arrow:active{transform:scale(.94);background:var(--surface3);color:var(--text)}
.dateBtn{
  min-height:44px;
  padding:2px 8px;
  text-align:center;
  border-radius:12px;
}
.dateMain{
  display:block;
  font-family:var(--num);
  font-size:1.75rem;
  font-weight:700;
  line-height:.95;
  letter-spacing:.015em;
}
.dateSub{
  display:block;
  margin-top:5px;
  color:var(--muted);
  font-size:.75rem;
  font-weight:600;
  letter-spacing:.06em;
  text-transform:uppercase;
}
#dateInput{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}

.strip{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:4px;
  margin-top:9px;
}
.cell{
  min-height:54px;
  padding:6px 0 5px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  border:1px solid transparent;
  border-radius:13px;
  color:var(--muted);
  transition:background .16s ease,border-color .16s ease,transform .16s ease;
}
.cell:active{transform:scale(.95)}
.cell .cw{font-size:.75rem;line-height:1;color:inherit}
.cell .cd{
  font-family:var(--num);
  font-size:1.22rem;
  font-weight:600;
  line-height:1;
  color:var(--text);
}
.cell .dot{
  width:5px;
  height:5px;
  margin-top:2px;
  border-radius:50%;
  background:transparent;
  box-shadow:0 0 0 0 transparent;
}
.cell .dot.full{background:var(--accent);box-shadow:0 0 10px rgba(200,255,88,.62)}
.cell.bugun{color:var(--accent)}
.cell.on{
  background:var(--accent-soft);
  border-color:var(--line-strong);
}
.cell.on .cd{color:var(--accent)}

.focusRow{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:8px;
  margin-top:10px;
}
.summaryControl,.trendControl{
  min-height:46px;
  border:1px solid var(--line);
  border-radius:14px;
  background:rgba(255,255,255,.025);
  transition:background .16s ease,border-color .16s ease,color .16s ease,transform .16s ease;
}
.summaryControl{
  min-width:0;
  padding:7px 10px 7px 12px;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto 18px;
  align-items:center;
  gap:9px;
  text-align:left;
}
.summaryControlText{display:flex;flex-direction:column;min-width:0}
.summaryControlText small{
  color:var(--muted);
  font-size:.69rem;
  line-height:1;
}
.summaryControlText strong{
  margin-top:4px;
  overflow:hidden;
  font-size:.88rem;
  line-height:1;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.summaryMetric{
  color:var(--muted);
  font-family:var(--num);
  font-size:.86rem;
  white-space:nowrap;
}
.summaryControl svg{width:18px;height:18px;color:var(--muted)}
.trendControl{
  padding:0 13px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  color:var(--accent);
  font-size:.82rem;
  font-weight:700;
}
.trendControl svg{width:18px;height:18px}
.summaryControl:active,.trendControl:active{transform:scale(.97);background:var(--surface3)}
.syncDot{
  width:8px;
  height:8px;
  border:2px solid rgba(255,255,255,.08);
  border-radius:50%;
  background:#4A514D;
}
.syncDot.ok{background:var(--up);box-shadow:0 0 10px rgba(115,230,170,.45)}
.syncDot.busy{background:var(--r2);animation:pulse 1.25s ease-in-out infinite}
.syncDot.err{background:var(--r0);box-shadow:0 0 10px rgba(255,112,112,.35)}
@keyframes pulse{50%{opacity:.4;transform:scale(.8)}}

.warn{
  margin:11px 12px 0;
  padding:11px 12px;
  border:1px solid rgba(255,112,112,.22);
  border-radius:13px;
  background:rgba(255,112,112,.09);
  color:#FFB0B0;
  font-size:.82rem;
  line-height:1.45;
}
.hata{margin:10px 0 0;color:#FFAAAA;font-size:.82rem;line-height:1.45}
.iyi{margin:10px 0 0;color:var(--up);font-size:.82rem;line-height:1.45}
.note{margin:10px 0 0;line-height:1.5}

.list{
  position:relative;
  width:min(100%,740px);
  margin:0 auto;
  padding:14px 12px calc(54px + env(safe-area-inset-bottom));
}
.empty{
  margin-top:2px;
  padding:52px 20px;
  text-align:center;
  background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.018));
  border:1px solid var(--line);
  border-radius:24px;
  box-shadow:var(--shadow);
}
.empty::before{
  content:"+";
  width:52px;
  height:52px;
  margin:0 auto 17px;
  display:grid;
  place-items:center;
  border:1px solid var(--line-strong);
  border-radius:17px;
  background:var(--accent-soft);
  color:var(--accent);
  font-family:var(--num);
  font-size:2rem;
  font-weight:500;
}
.emptyTitle{
  margin:0 0 7px;
  font-family:var(--num);
  font-size:1.65rem;
  font-weight:700;
}
.empty .muted{max-width:34ch;margin:0 auto;line-height:1.55}
.emptyBtns{display:flex;flex-direction:column;gap:9px;margin-top:22px}

.primary,.ghost{
  min-height:49px;
  width:100%;
  padding:12px 15px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  border-radius:14px;
  font-size:.94rem;
  font-weight:700;
  transition:transform .16s ease,filter .16s ease,background .16s ease,border-color .16s ease;
}
.primary{
  background:linear-gradient(135deg,#D5FF7B,var(--accent));
  color:var(--accent-ink);
  box-shadow:0 10px 28px rgba(200,255,88,.13);
}
.ghost{border:1px solid var(--line);background:rgba(255,255,255,.018);color:var(--text)}
.primary:active,.ghost:active{transform:scale(.98)}
.primary:disabled,.ghost:disabled{opacity:.38;cursor:not-allowed}
.ghost.danger{border-color:rgba(255,112,112,.3);color:var(--r0)}

.ex{
  position:relative;
  overflow:hidden;
  margin-bottom:12px;
  padding:16px 14px 12px;
  background:
    linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.018)),
    var(--surface-solid);
  border:1px solid var(--line);
  border-radius:22px;
  box-shadow:0 14px 36px rgba(0,0,0,.22);
}
.ex::before{
  content:"";
  position:absolute;
  top:0;
  left:22px;
  right:22px;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(200,255,88,.65),transparent);
}
.exHead{display:flex;align-items:center;gap:9px}
.exName{
  min-width:0;
  flex:1;
  display:flex;
  align-items:center;
  gap:8px;
  text-align:left;
  font-size:1.02rem;
  font-weight:750;
  line-height:1.35;
  letter-spacing:-.01em;
}
.historyArrow{
  flex:none;
  color:var(--accent);
  font-family:var(--num);
  font-size:.95rem;
  font-weight:600;
}
.iconBtn{
  width:36px;
  height:36px;
  flex:none;
  display:grid;
  place-items:center;
  border:1px solid transparent;
  border-radius:11px;
  color:var(--muted);
  transition:background .16s ease,border-color .16s ease,color .16s ease,transform .16s ease;
}
.iconBtn svg{width:19px;height:19px}
.iconBtn:active{transform:scale(.92);background:var(--surface3);color:var(--text)}
.confirm{display:flex;align-items:center;gap:4px;flex:none}
.confirm .del,.confirm .cancel{
  min-height:34px;
  padding:5px 9px;
  border-radius:9px;
  font-size:.82rem;
}
.confirm .del{background:rgba(255,112,112,.1);color:var(--r0);font-weight:700}
.confirm .cancel{color:var(--muted)}

.gecen{
  margin:10px 0 0;
  padding:7px 9px;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:6px;
  background:rgba(255,255,255,.025);
  border:1px solid rgba(255,255,255,.045);
  border-radius:11px;
  color:var(--muted);
  font-family:var(--num);
  font-size:.93rem;
}
.gLabel{
  padding:2px 7px;
  border:1px solid var(--line-strong);
  border-radius:7px;
  color:var(--accent);
  font-family:var(--sans);
  font-size:.7rem;
  font-weight:700;
  letter-spacing:.02em;
}
.gSet+.gSet::before{content:"·";margin-right:6px;opacity:.45}
.up{color:var(--up);font-size:.75rem}

.sets{
  list-style:none;
  margin:10px 0 0;
  padding:0;
  display:flex;
  flex-direction:column;
  gap:6px;
}
.setRow{
  width:100%;
  min-height:58px;
  padding:10px 11px;
  display:block;
  text-align:left;
  background:rgba(255,255,255,.035);
  border:1px solid transparent;
  border-radius:14px;
  transition:background .16s ease,border-color .16s ease,transform .16s ease;
}
.setRow:active{transform:scale(.988);background:var(--surface3);border-color:var(--line)}
.setMain{
  display:grid;
  grid-template-columns:26px minmax(64px,1fr) minmax(76px,1fr) auto;
  align-items:center;
  gap:8px;
}
.idx{
  width:24px;
  height:24px;
  display:grid;
  place-items:center;
  border:1px solid var(--line);
  border-radius:8px;
  color:var(--muted);
  font-family:var(--num);
  font-size:.85rem;
}
.w,.reps{
  font-family:var(--num);
  font-size:1.5rem;
  font-weight:700;
  line-height:1;
}
.w em,.reps em{
  margin-left:4px;
  color:var(--muted);
  font-family:var(--sans);
  font-size:.68rem;
  font-style:normal;
  font-weight:500;
}
.rir{
  padding:5px 8px;
  border:1px solid transparent;
  border-radius:9px;
  font-size:.72rem;
  font-weight:800;
  white-space:nowrap;
}
.rir.r0{border-color:rgba(255,112,112,.16);background:rgba(255,112,112,.11);color:var(--r0)}
.rir.r1{border-color:rgba(255,174,98,.16);background:rgba(255,174,98,.11);color:var(--r1)}
.rir.r2{border-color:rgba(231,214,96,.16);background:rgba(231,214,96,.10);color:var(--r2)}
.rir.r3{border-color:rgba(121,168,255,.16);background:rgba(121,168,255,.11);color:var(--r3)}
.setNote{
  display:block;
  margin:7px 0 0 34px;
  color:var(--muted);
  font-size:.79rem;
  line-height:1.4;
}
.addSet{
  width:100%;
  min-height:42px;
  margin-top:7px;
  padding:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  border-radius:12px;
  background:var(--accent-soft);
  color:var(--accent);
  font-size:.85rem;
  font-weight:700;
}
.addSet:active{background:rgba(200,255,88,.17)}
.addEx{
  width:100%;
  min-height:58px;
  padding:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  border:1px dashed rgba(200,255,88,.34);
  border-radius:18px;
  background:rgba(200,255,88,.035);
  color:var(--accent);
  font-size:.91rem;
  font-weight:700;
}
.addEx:active{background:var(--accent-soft)}
.spacer{height:12px}

/* Özet kartları: ayrıntılar yalnızca kart açıldığında görünür. */
.ex{padding:0}
.ex.open{border-color:rgba(200,255,88,.18)}
.exSummary{
  width:100%;
  min-height:72px;
  padding:15px 14px;
  display:grid;
  grid-template-columns:minmax(0,1fr) 24px;
  align-items:center;
  gap:10px;
  text-align:left;
}
.exSummaryText{display:flex;flex-direction:column;min-width:0}
.exTitle{
  overflow:hidden;
  font-size:1rem;
  font-weight:750;
  line-height:1.35;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.exMeta{
  margin-top:5px;
  overflow:hidden;
  color:var(--muted);
  font-family:var(--num);
  font-size:.86rem;
  line-height:1.25;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.exChevron{
  width:22px;
  height:22px;
  color:var(--muted);
  transition:transform .18s ease,color .18s ease;
}
.ex.open .exChevron{transform:rotate(180deg);color:var(--accent)}
.exDetails{
  padding:12px 14px 13px;
  border-top:1px solid var(--line);
  animation:reveal .18s ease;
}
@keyframes reveal{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.detailActions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}
.detailAction{
  min-height:40px;
  padding:8px 10px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  background:rgba(255,255,255,.03);
  border:1px solid var(--line);
  border-radius:11px;
  color:var(--muted);
  font-size:.8rem;
  font-weight:700;
}
.detailAction svg{width:17px;height:17px}
.detailAction.danger{color:var(--r0)}
.deleteConfirm{
  grid-column:1/-1;
  padding:7px 8px;
  display:flex;
  align-items:center;
  gap:6px;
  background:rgba(255,112,112,.08);
  border-radius:11px;
}
.deleteConfirm span{flex:1;color:#FFB0B0;font-size:.78rem}
.deleteConfirm button{min-height:32px;padding:5px 9px;border-radius:8px;font-size:.78rem}
.deleteConfirm .yes{background:var(--r0);color:#160707;font-weight:800}
.deleteConfirm .no{color:var(--muted)}

.focusChoices{display:grid;gap:8px}
.focusChoice{
  width:100%;
  min-height:52px;
  padding:12px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border:1px solid var(--line);
  border-radius:14px;
  background:rgba(255,255,255,.03);
  color:var(--text);
  font-size:.94rem;
  font-weight:700;
}
.focusChoice.on{border-color:var(--line-strong);background:var(--accent-soft);color:var(--accent)}
.focusChoice svg{width:19px;height:19px}

.chartPanel{
  padding:15px 13px 13px;
  background:rgba(255,255,255,.025);
  border:1px solid var(--line);
  border-radius:18px;
}
.chartHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.chartHead strong{font-size:.88rem}
.chartLegend{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.75rem}
.chartLegendDot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 9px rgba(200,255,88,.42)}
.chartSvg{width:100%;height:auto;display:block;overflow:visible}
.chartGrid{stroke:rgba(255,255,255,.075);stroke-width:1}
.chartArea{fill:url(#volumeFill)}
.chartLine{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.chartDot{fill:#121615;stroke:var(--accent);stroke-width:2.5}
.chartDot.last{fill:var(--accent)}
.chartLabel{fill:var(--muted);font-family:var(--sans);font-size:12px}
.chartStats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.chartStat{padding:11px 12px;background:rgba(255,255,255,.035);border-radius:12px}
.chartStat small{display:block;color:var(--muted);font-size:.72rem}
.chartStat strong{display:block;margin-top:4px;font-family:var(--num);font-size:1.08rem}
.chartEmpty{padding:42px 18px;text-align:center;color:var(--muted);line-height:1.5}

.overlay{
  position:fixed;
  inset:0;
  z-index:30;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding-top:20px;
  background:rgba(1,3,2,.76);
  -webkit-backdrop-filter:blur(8px);
  backdrop-filter:blur(8px);
}
.sheet{
  position:relative;
  width:min(100%,720px);
  max-height:90vh;
  overflow-y:auto;
  overscroll-behavior:contain;
  padding:27px 15px calc(22px + env(safe-area-inset-bottom));
  background:
    linear-gradient(160deg,rgba(255,255,255,.055),transparent 26%),
    #121615;
  border:1px solid var(--line);
  border-bottom:0;
  border-radius:28px 28px 0 0;
  box-shadow:0 -24px 70px rgba(0,0,0,.48);
  animation:rise .22s cubic-bezier(.2,.75,.25,1);
}
.sheet::before{
  content:"";
  position:absolute;
  top:10px;
  left:50%;
  width:44px;
  height:4px;
  border-radius:999px;
  background:rgba(255,255,255,.16);
  transform:translateX(-50%);
}
@keyframes rise{from{transform:translateY(22px);opacity:.55}to{transform:none;opacity:1}}
.sheetHead{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  margin-bottom:19px;
}
.sheetTitle{
  margin:0;
  font-size:1.08rem;
  font-weight:800;
  line-height:1.3;
}
.sheetAlt{margin:4px 0 0;color:var(--muted);font-size:.78rem}
.sheetHead .iconBtn{margin-top:-5px}

.menu{display:flex;flex-direction:column;gap:8px}
.menuItem{
  width:100%;
  padding:14px;
  display:block;
  text-align:left;
  background:rgba(255,255,255,.035);
  border:1px solid var(--line);
  border-radius:15px;
  color:var(--muted);
  transition:background .16s ease,border-color .16s ease,transform .16s ease;
}
.menuItem:active{transform:scale(.99);background:var(--surface3);border-color:var(--line-strong)}
.menuItem b{display:block;margin-bottom:4px;color:var(--text);font-size:.94rem;font-weight:750}
.menuItem em{display:block;font-size:.78rem;font-style:normal;line-height:1.5}
.ta{
  width:100%;
  padding:13px;
  resize:vertical;
  background:var(--surface2);
  border:1px solid var(--line);
  border-radius:14px;
  color:var(--text);
  font-family:ui-monospace,'SF Mono',Menlo,monospace;
  font-size:.78rem;
  line-height:1.55;
}
.field{margin-bottom:18px}
.fLabel{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:8px;
  color:var(--muted);
  font-size:.85rem;
  font-weight:650;
}
.fLabel .hint{font-size:.75rem;font-weight:500;opacity:.85}
.unit{
  display:flex;
  padding:2px;
  overflow:hidden;
  background:rgba(255,255,255,.025);
  border:1px solid var(--line);
  border-radius:10px;
}
.unit button{
  min-height:28px;
  padding:3px 10px;
  border-radius:7px;
  color:var(--muted);
  font-size:.75rem;
  font-weight:700;
}
.unit button.on{background:var(--accent);color:var(--accent-ink)}
.stepper{display:grid;grid-template-columns:58px minmax(0,1fr) 58px;gap:7px}
.stepper button{
  min-height:58px;
  display:grid;
  place-items:center;
  background:var(--surface2);
  border:1px solid var(--line);
  border-radius:15px;
  color:var(--accent);
  font-family:var(--num);
  font-size:1.7rem;
  font-weight:600;
}
.stepper button:active{background:var(--surface3)}
.stepper input{
  width:100%;
  min-width:0;
  padding:10px 5px;
  background:var(--surface2);
  border:1px solid var(--line);
  border-radius:15px;
  color:var(--text);
  text-align:center;
  font-family:var(--num);
  font-size:2.25rem;
  font-weight:700;
}
.rirRow{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.rirChip{
  min-height:51px;
  padding:10px 0;
  background:var(--surface2);
  border:1.5px solid var(--line);
  border-radius:13px;
  color:var(--muted);
  font-family:var(--num);
  font-size:1.3rem;
  font-weight:700;
}
.rirChip.r0.on{border-color:var(--r0);background:rgba(255,112,112,.15);color:var(--r0)}
.rirChip.r1.on{border-color:var(--r1);background:rgba(255,174,98,.15);color:var(--r1)}
.rirChip.r2.on{border-color:var(--r2);background:rgba(231,214,96,.14);color:var(--r2)}
.rirChip.r3.on{border-color:var(--r3);background:rgba(121,168,255,.15);color:var(--r3)}
.rirChip.half{font-size:1.1rem}
.rirChip.half.on{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.sheetBtns{display:flex;flex-direction:column;gap:9px;margin-top:22px}

.inp{
  width:100%;
  min-height:50px;
  margin-bottom:10px;
  padding:12px 13px;
  background:var(--surface2);
  border:1px solid var(--line);
  border-radius:14px;
  color:var(--text);
  font-size:1rem;
}
.inp::placeholder{color:#758078}
.picker{margin-top:6px}
.group{margin-bottom:17px}
.groupName{
  margin:0 0 7px;
  color:var(--accent);
  font-family:var(--num);
  font-size:.8rem;
  font-weight:700;
  letter-spacing:.09em;
  text-transform:uppercase;
}
.pick{
  width:100%;
  min-height:48px;
  margin-bottom:5px;
  padding:11px 13px;
  display:block;
  text-align:left;
  background:rgba(255,255,255,.035);
  border:1px solid var(--line);
  border-radius:13px;
  font-size:.91rem;
  font-weight:600;
}
.pick:active{background:var(--surface3);border-color:var(--line-strong)}

.hist{display:flex;flex-direction:column;gap:11px}
.histRow{
  padding:11px 0 0;
  border-top:1px solid var(--line);
}
.histDate{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
  color:var(--muted);
  font-size:.8rem;
}
.histDate em{font-family:var(--num);font-size:.95rem;font-style:normal}
.histSets{display:flex;flex-wrap:wrap;gap:6px}
.pill{
  padding:5px 9px;
  background:var(--surface2);
  border:1px solid var(--line);
  border-radius:9px;
  font-family:var(--num);
  font-size:1.05rem;
  font-weight:700;
}
.pill em{margin-left:5px;font-size:.65rem;font-style:normal;opacity:.8;vertical-align:top}
.pill.r0{color:var(--r0)}.pill.r1{color:var(--r1)}.pill.r2{color:var(--r2)}.pill.r3{color:var(--r3)}
.url{
  margin:0 0 10px;
  padding:10px 11px;
  word-break:break-all;
  background:var(--surface2);
  border:1px solid var(--line);
  border-radius:11px;
  color:var(--muted);
  font-family:ui-monospace,Menlo,monospace;
  font-size:.74rem;
  line-height:1.5;
}

@media (hover:hover){
  .arrow:hover,.iconBtn:hover{background:var(--surface3);color:var(--text)}
  .chip:hover{border-color:rgba(255,255,255,.18);color:var(--text)}
  .setRow:hover{background:rgba(255,255,255,.06);border-color:var(--line)}
  .primary:hover{filter:brightness(1.05)}
  .ghost:hover,.addEx:hover{border-color:var(--line-strong);background:var(--accent-soft)}
  .menuItem:hover,.pick:hover{border-color:var(--line-strong);background:rgba(255,255,255,.055)}
}
@media (min-width:760px){
  body{padding-bottom:36px}
  .top{
    top:12px;
    margin-top:12px;
    padding:14px;
    border-top:1px solid var(--line);
    border-radius:26px;
  }
  .list{padding:18px 0 40px}
  .warn{margin-inline:0}
  .sheet{
    max-height:86vh;
    margin-bottom:20px;
    border-bottom:1px solid var(--line);
    border-radius:28px;
  }
  .overlay{align-items:center;padding:24px}
}
@media (max-width:390px){
  .top{padding-inline:9px}
  .summaryMetric{font-size:.78rem}
  .trendControl{padding-inline:11px}
  .trendControl span{display:none}
  .setMain{gap:6px}
  .w,.reps{font-size:1.35rem}
  .rir{padding-inline:6px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<header class="top">
  <div class="brandRow">
    <div class="brandLockup">
      <span class="brandMark" aria-hidden="true">ST</span>
      <span class="brandText"><strong>SetTrack</strong></span>
    </div>
    <div class="brandTools">
      <span class="syncDot" id="syncDot" aria-hidden="true"></span>
      <button class="iconBtn" id="menuBtn" aria-label="Menü"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg></button>
    </div>
  </div>
  <div class="nav">
    <button class="arrow" id="prev" aria-label="Önceki gün"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="dateBtn" id="dateBtn"><span class="dateMain" id="dateMain"></span><span class="dateSub" id="dateSub"></span></button>

    <input type="date" id="dateInput">
  </div>
  <div class="strip" id="strip"></div>
  <div class="focusRow" id="focusRow"></div>
</header>
<div id="warnSlot"></div>
<main class="list" id="list"></main>
<div id="overlaySlot"></div>

<script>
/* ---------- sabitler ---------- */
var LS = "gymlog:v1", LSCFG = "gymlog:cfg";
var LB_TO_KG = 0.45359237;
var GUNLER = ["Paz","Pzt","Sal","Çar","Per","Cum","Cmt"];
var GUNLER_UZUN = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
var AYLAR = ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
var AYLAR_UZUN = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
var ODAK = [{id:"itis",ad:"İtiş"},{id:"cekis",ad:"Çekiş"},{id:"bacak",ad:"Bacak"}];
var HAZIR = {
  itis:["Flat bench press","İncline machine plate loaded press","Single arm cable overhead triceps","Cable single arm lateral raise behind back","Shoulder press","Cable fly","Triceps pushdown"],
  cekis:["Cable wide grip lat pulldown","Cable V bar row","Rear delt fly","Dependent biceps curl machine","Dumbbell hammer curl","Chest supported row","Face pull"],
  bacak:["Plate loaded leg press","Seated leg curl machine","Magnum seated calf plate loaded","Cable ab crunches","Squat","Romanian deadlift","Leg extension"]
};
var SEMA = 'Antrenman günlüğüm aşağıda JSON olarak. Şema:\n'
 + 'days["YYYY-MM-DD"] = { focus: "itis"|"cekis"|"bacak"|null, exercises: [ { name, unit, sets: [ { w, u:"kg"|"lbs", reps, rir, note } ] } ] }\n'
 + 'rir = sette yedekte kalan tekrar (0-4, 0.5 basamaklı olabilir). w = kaldırılan ağırlık; tek kollu/tek elli hareketlerde tek taraf için.\n'
 + 'Bir şey değiştirirsen cevabın SADECE aynı şemada geçerli JSON olsun; açıklama, markdown veya kod bloğu ekleme.';

/* ---------- yardımcılar ---------- */
function uid(){return Math.random().toString(36).slice(2,9)}
function pad(n){return String(n).padStart(2,"0")}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parseD(s){var p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2])}
function shiftD(s,n){var d=parseD(s);d.setDate(d.getDate()+n);return iso(d)}
function fmt(n){return Number(n).toFixed(2).replace(/\.?0+$/,"")}
function toKg(w,u){return u==="lbs"?w*LB_TO_KG:w}
function rirClass(r){var f=Math.floor(r);return f<=0?"r0":f===1?"r1":f===2?"r2":"r3"}
function hacimYazi(v){return v>=1000?(v/1000).toFixed(1)+" t":Math.round(v)+" kg"}
function enIyiSet(sets){
  return (sets||[]).reduce(function(best,s){
    if(!best) return s;
    var sw=toKg(s.w,s.u), bw=toKg(best.w,best.u);
    return sw>bw||(sw===bw&&s.reps>best.reps)?s:best;
  },null);
}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function el(tag,cls,html){var n=document.createElement(tag);if(cls)n.className=cls;if(html!=null)n.innerHTML=html;return n}

/* ---------- başlangıç verisi ---------- */
function st(w,u,reps,rir,note){return{id:uid(),w:w,u:u,reps:reps,rir:rir,note:note||""}}
function ex(name,sets){return{id:uid(),name:name,unit:sets[0].u,sets:sets}}
var SEED = {
 "2026-08-26":{focus:"itis",exercises:[
  ex("Flat bench press",[st(60,"kg",14,1),st(75,"kg",8,1.5),st(75,"kg",7,1)]),
  ex("İncline machine plate loaded press",[st(80,"kg",9,1.5,"+starting"),st(80,"kg",8,1,"+starting"),st(80,"kg",6,1,"+starting")]),
  ex("Single arm cable overhead triceps",[st(15.8,"kg",4,0,"sağ · +1 destekli"),st(15.8,"kg",3,0,"sol · +2 destekli"),st(13.5,"kg",5,0,"sağ · +1 destekli"),st(13.5,"kg",5,0,"sol · +1 destekli"),st(11.3,"kg",6,0,"sağ"),st(11.3,"kg",7,0,"sol")]),
  ex("Cable single arm lateral raise behind back",[st(9,"kg",8,1,"sağ"),st(9,"kg",8,2,"sol"),st(6.8,"kg",10,1,"sağ"),st(6.8,"kg",9,1,"sol"),st(4.5,"kg",12,1,"sağ"),st(4.5,"kg",11,1,"sol")])]},
 "2026-08-27":{focus:"cekis",exercises:[
  ex("Cable wide grip lat pulldown",[st(86,"kg",7,0),st(79,"kg",8,0),st(79,"kg",7,0)]),
  ex("Cable V bar row",[st(73,"kg",9,1),st(73,"kg",11,0),st(73,"kg",8,0)]),
  ex("Rear delt fly",[st(45,"kg",11,1),st(48.4,"kg",6,1),st(45,"kg",9,0)]),
  ex("Dependent biceps curl machine",[st(32,"kg",12,1),st(32,"kg",10,1),st(32,"kg",9,0)]),
  ex("Dumbbell hammer curl",[st(18,"kg",15,2,"her el"),st(20,"kg",10,1,"her el"),st(20,"kg",13,1,"her el")])]},
 "2026-08-28":{focus:"bacak",exercises:[
  ex("Plate loaded leg press",[st(200,"kg",11,1,"+starting"),st(240,"kg",8,1,"+starting"),st(240,"kg",9,1,"+starting · bacaklar titredi, ROM ve negatif kısaldı")]),
  ex("Seated leg curl machine",[st(50,"kg",17,1),st(59,"kg",6,1),st(54,"kg",7,1)]),
  ex("Magnum seated calf plate loaded",[st(120,"lbs",6,1,"+starting"),st(100,"lbs",7,1,"+starting"),st(100,"lbs",10,0,"+starting")]),
  ex("Cable ab crunches",[st(45,"kg",17,1),st(50,"kg",16,1),st(45,"kg",11,1)])]},
 "2026-08-30":{focus:"itis",exercises:[
  ex("Flat bench press",[st(175,"lbs",6,1.5),st(165,"lbs",8,1.5),st(165,"lbs",7,1)]),
  ex("İncline machine plate loaded press",[st(190,"lbs",6,1,"+starting"),st(180,"lbs",10,1.5,"+starting"),st(180,"lbs",9,0,"+starting")]),
  ex("Single arm cable overhead triceps",[st(11.3,"kg",10,1,"sol"),st(11.3,"kg",11,1,"sağ"),st(11.3,"kg",11,0,"sol"),st(11.3,"kg",11,0.5,"sağ"),st(11.3,"kg",10,0.5,"sol"),st(11.3,"kg",10,0.5,"sağ")]),
  ex("Cable single arm lateral raise behind back",[st(9,"kg",7,0.5,"sağ"),st(9,"kg",7,0.5,"sol"),st(6.8,"kg",10,0.5),st(4.5,"kg",14,3)])]},
 "2026-09-01":{focus:"cekis",exercises:[
  ex("Cable wide grip lat pulldown",[st(86,"kg",8,1),st(86,"kg",8,0.5),st(86,"kg",7,0)]),
  ex("Cable V bar row",[st(79,"kg",8,1),st(79,"kg",7,1),st(79,"kg",7,0)]),
  ex("Rear delt fly",[st(45,"kg",12,1),st(45,"kg",10,1),st(45,"kg",10,0)]),
  ex("Dependent biceps curl machine",[st(35.4,"kg",11,1),st(36,"kg",10,0),st(36,"kg",9,0)]),
  ex("Dumbbell hammer curl",[st(20,"kg",14,1,"her el"),st(50,"lbs",10,1,"her el"),st(50,"lbs",10,0,"her el")])]}
};

/* ---------- durum ---------- */
var D = {defaultUnit:"kg",days:{},seeded:false,updatedAt:new Date(0).toISOString()};
var CFG = {owner:"",repo:"",path:"log.json",branch:"main",token:""};
var date = iso(new Date()), today = iso(new Date());
var sha = null, syncState = "off", syncMsg = "", pushTimer = null, confirmEx = null, expandedEx = null;

try{var rawCfg=localStorage.getItem(LSCFG); if(rawCfg) CFG=Object.assign(CFG,JSON.parse(rawCfg));}catch(e){}
try{
  var raw=localStorage.getItem(LS);
  if(raw){var p=JSON.parse(raw); if(p&&p.days) D=Object.assign(D,p);}
}catch(e){}
if(!D.seeded){ D.days=Object.assign({},SEED,D.days); D.seeded=true; }

/* ---------- kalıcılık ---------- */
function saveLocal(touch){
  if(touch!==false) D.updatedAt=new Date().toISOString();
  try{localStorage.setItem(LS,JSON.stringify(D));}catch(e){}
  if(CFG.token&&CFG.owner&&CFG.repo){
    clearTimeout(pushTimer);
    pushTimer=setTimeout(function(){push();},2500);
  }
}
function saveCfg(){try{localStorage.setItem(LSCFG,JSON.stringify(CFG));}catch(e){}}

/* ---------- GitHub senkron ---------- */
function b64enc(s){
  var bytes=new TextEncoder().encode(s), bin="";
  for(var i=0;i<bytes.length;i+=0x8000) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
  return btoa(bin);
}
function b64dec(b){
  var bin=atob(String(b).replace(/\s/g,"")), bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function api(){return "https://api.github.com/repos/"+CFG.owner+"/"+CFG.repo+"/contents/"+CFG.path}
function ghHeaders(){return {Authorization:"Bearer "+CFG.token,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}}
function setSync(s,m){syncState=s;syncMsg=m||"";renderFocus();}

function pull(force){
  if(!(CFG.token&&CFG.owner&&CFG.repo)) return Promise.resolve();
  setSync("busy");
  return fetch(api()+"?ref="+encodeURIComponent(CFG.branch)+"&t="+Date.now(),{headers:ghHeaders()})
   .then(function(r){
     if(r.status===404){sha=null;setSync("ok","Bulutta dosya yok, ilk gönderimde oluşacak.");return null;}
     if(!r.ok) throw new Error("HTTP "+r.status);
     return r.json();
   })
   .then(function(j){
     if(!j) return;
     sha=j.sha;
     var remote=JSON.parse(b64dec(j.content));
     if(!remote||!remote.days) throw new Error("Buluttaki dosya tanınmadı");
     var rt=remote.updatedAt||"", lt=D.updatedAt||"";
     if(force||rt>lt){
       D=Object.assign({defaultUnit:"kg",seeded:true},remote);
       try{localStorage.setItem(LS,JSON.stringify(D));}catch(e){}
       render();
       setSync("ok","Buluttan çekildi.");
     } else setSync("ok", rt===lt?"Eşit.":"Yerel daha yeni.");
   })
   .catch(function(e){setSync("err",e.message);});
}

function push(){
  if(!(CFG.token&&CFG.owner&&CFG.repo)) return Promise.resolve();
  setSync("busy");
  var body={message:"antrenman "+new Date().toISOString(),content:b64enc(JSON.stringify(D,null,1)),branch:CFG.branch};
  if(sha) body.sha=sha;
  return fetch(api(),{method:"PUT",headers:Object.assign({"Content-Type":"application/json"},ghHeaders()),body:JSON.stringify(body)})
   .then(function(r){
     if(r.status===409||r.status===422){ return pull(false).then(function(){ return null; }); }
     if(!r.ok) return r.text().then(function(t){throw new Error("HTTP "+r.status+" "+t.slice(0,120));});
     return r.json();
   })
   .then(function(j){ if(j&&j.content){sha=j.content.sha;setSync("ok","Buluta yazıldı.");} })
   .catch(function(e){setSync("err",e.message);});
}

/* ---------- veri sorguları ---------- */
function gunu(k){return D.days[k]||{focus:null,exercises:[]}}
function gecenSefer(name){
  var keys=Object.keys(D.days).filter(function(k){return k<date}).sort().reverse();
  for(var i=0;i<keys.length;i++){
    var arr=gunu(keys[i]).exercises||[];
    for(var j=0;j<arr.length;j++)
      if(arr[j].name.toLowerCase()===name.toLowerCase()&&arr[j].sets.length) return {tarih:keys[i],sets:arr[j].sets};
  }
  return null;
}
function gecmis(name){
  return Object.keys(D.days).sort().reverse().map(function(k){
    var e=(gunu(k).exercises||[]).filter(function(x){return x.name.toLowerCase()===name.toLowerCase()&&x.sets.length})[0];
    return e?{tarih:k,sets:e.sets}:null;
  }).filter(Boolean);
}
function ozet(k){var s=0,h=0;(gunu(k).exercises||[]).forEach(function(e){e.sets.forEach(function(x){s++;h+=toKg(x.w,x.u)*x.reps})});return {sets:s,hacim:h}}
function toplam(){var g=0,s=0;for(var k in D.days){var n=0;(D.days[k].exercises||[]).forEach(function(e){n+=e.sets.length});if(n){g++;s+=n}}return {gun:g,sets:s}}

/* ---------- taşınabilir biçim ---------- */
function slim(){
  var out={};
  Object.keys(D.days).sort().forEach(function(k){
    var v=D.days[k], list=(v.exercises||[]).filter(function(e){return e.sets.length});
    if(!list.length) return;
    out[k]={focus:v.focus||null,exercises:list.map(function(e){
      return {name:e.name,unit:e.unit,sets:e.sets.map(function(s){
        var o={w:s.w,u:s.u,reps:s.reps,rir:s.rir}; if(s.note)o.note=s.note; return o;})};
    })};
  });
  return {days:out};
}
function toMarkdown(){
  return Object.keys(D.days).sort().map(function(k){
    var v=D.days[k], list=(v.exercises||[]).filter(function(e){return e.sets.length});
    if(!list.length) return "";
    var d=parseD(k), o=v.focus?(" — "+ODAK.filter(function(x){return x.id===v.focus})[0].ad):"";
    var body=list.map(function(e){
      return [e.name].concat(e.sets.map(function(s){
        return fmt(s.w)+" "+s.u+" × "+s.reps+" tekrar · RIR "+fmt(s.rir)+(s.note?" ("+s.note+")":"");
      })).join("\n");
    }).join("\n\n");
    return "## "+d.getDate()+" "+AYLAR_UZUN[d.getMonth()]+" "+d.getFullYear()+o+"\n"+body;
  }).filter(Boolean).join("\n\n");
}
function hydrate(obj){
  var days={};
  var src=(obj&&obj.days)||{};
  Object.keys(src).forEach(function(k){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||!src[k]) return;
    var v=src[k];
    days[k]={
      focus:["itis","cekis","bacak"].indexOf(v.focus)>=0?v.focus:null,
      exercises:(v.exercises||[]).map(function(e){
        return {id:uid(),name:String((e&&e.name)||"").trim(),unit:(e&&e.unit)==="lbs"?"lbs":"kg",
          sets:((e&&e.sets)||[]).map(function(s){
            return {id:uid(),w:Number(s&&s.w)||0,u:(s&&s.u)==="lbs"?"lbs":"kg",
              reps:Math.max(0,Math.round(Number(s&&s.reps)||0)),rir:Math.max(0,Number(s&&s.rir)||0),
              note:(s&&s.note)?String(s.note):""};
          })};
      }).filter(function(e){return e.name})
    };
  });
  return days;
}

function volumeChart(data){
  var W=360,H=198,L=42,R=12,T=19,B=39,base=H-B;
  var max=Math.max.apply(null,data.map(function(x){return x.hacim})), ceiling=max?max*1.08:1;
  var pts=data.map(function(x,i){
    return {x:data.length===1?(L+W-R)/2:L+i*(W-L-R)/(data.length-1),y:T+(ceiling-x.hacim)/ceiling*(base-T),tarih:x.tarih,hacim:x.hacim};
  });
  var path=pts.map(function(p,i){return (i?"L":"M")+p.x.toFixed(1)+" "+p.y.toFixed(1)}).join(" ");
  var area=path+" L "+pts[pts.length-1].x.toFixed(1)+" "+base+" L "+pts[0].x.toFixed(1)+" "+base+" Z";
  var grid=[0,.5,1].map(function(f){var y=T+(base-T)*f;return '<line class="chartGrid" x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'"/>'}).join("");
  var labels={}, last=data.length-1;
  if(data.length<=4){for(var i=0;i<data.length;i++)labels[i]=true;}
  else {[0,Math.round(last/3),Math.round(last*2/3),last].forEach(function(i){labels[i]=true})}
  var xLabels=pts.map(function(p,i){
    if(!labels[i]) return "";
    var d=parseD(p.tarih), anchor=i===0?"start":(i===last?"end":"middle");
    return '<text class="chartLabel" x="'+p.x.toFixed(1)+'" y="'+(H-9)+'" text-anchor="'+anchor+'">'+d.getDate()+" "+AYLAR[d.getMonth()]+'</text>';
  }).join("");
  var dots=pts.map(function(p,i){return '<circle class="chartDot'+(i===last?' last':'')+'" cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="4"><title>'+hacimYazi(p.hacim)+'</title></circle>'}).join("");
  return '<svg class="chartSvg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Son '+data.length+' antrenmanın toplam hacim grafiği">'
    +'<title>Antrenman hacmi gelişimi</title><defs><linearGradient id="volumeFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C8FF58" stop-opacity=".24"/><stop offset="1" stop-color="#C8FF58" stop-opacity="0"/></linearGradient></defs>'
    +grid+'<text class="chartLabel" x="0" y="'+(T+4)+'">'+hacimYazi(max)+'</text><text class="chartLabel" x="25" y="'+(base+4)+'" text-anchor="end">0</text>'
    +'<path class="chartArea" d="'+area+'"/><path class="chartLine" d="'+path+'"/>'+dots+xLabels+'</svg>';
}

/* ---------- set sheet ---------- */
function setSheet(exId,setId){
  var g=gunu(date), exr=g.exercises.filter(function(e){return e.id===exId})[0];
  var mevcut=setId?exr.sets.filter(function(s){return s.id===setId})[0]:null;
  var son=exr.sets[exr.sets.length-1], baz=mevcut||son;
  var u=baz?baz.u:(exr.unit||D.defaultUnit), reps=baz?baz.reps:8, rir=baz?baz.rir:1;
  var sh=openSheet(exr.name,setId?(exr.sets.indexOf(mevcut)+1)+". set":(exr.sets.length+1)+". set");

  var f1=el("div","field");
  f1.innerHTML='<div class="fLabel"><span>Kilo</span><div class="unit"><button data-u="kg">kg</button><button data-u="lbs">lbs</button></div></div>'
    +'<div class="stepper"><button id="wMinus">−</button><input id="wIn" type="text" inputmode="decimal" placeholder="0"><button id="wPlus">+</button></div>';
  sh.appendChild(f1);
  var wIn=f1.querySelector("#wIn"); wIn.value=baz?String(baz.w):"";
  function paintUnit(){f1.querySelectorAll(".unit button").forEach(function(b){b.className=b.dataset.u===u?"on":""})}
  f1.querySelectorAll(".unit button").forEach(function(b){b.onclick=function(){u=b.dataset.u;paintUnit()}});
  paintUnit();
  function bump(n){var v=(parseFloat(wIn.value)||0)+n;wIn.value=String(Math.max(0,Math.round(v*100)/100))}
  f1.querySelector("#wMinus").onclick=function(){bump(u==="kg"?-2.5:-5)};
  f1.querySelector("#wPlus").onclick=function(){bump(u==="kg"?2.5:5)};
  wIn.oninput=function(){wIn.value=wIn.value.replace(",",".").replace(/[^0-9.]/g,"")};

  var f2=el("div","field");
  f2.innerHTML='<div class="fLabel"><span>Tekrar</span></div>'
    +'<div class="stepper"><button id="rMinus">−</button><input id="rIn" type="text" inputmode="numeric"><button id="rPlus">+</button></div>';
  sh.appendChild(f2);
  var rIn=f2.querySelector("#rIn"); rIn.value=reps;
  f2.querySelector("#rMinus").onclick=function(){rIn.value=Math.max(1,(parseInt(rIn.value,10)||0)-1)};
  f2.querySelector("#rPlus").onclick=function(){rIn.value=(parseInt(rIn.value,10)||0)+1};
  rIn.oninput=function(){rIn.value=rIn.value.replace(/[^0-9]/g,"")};

  var f3=el("div","field");
  f3.innerHTML='<div class="fLabel"><span>RIR</span><span class="hint">yedekte kalan tekrar</span></div><div class="rirRow"></div>';
  sh.appendChild(f3);
  var row=f3.querySelector(".rirRow"), chips=[];
  [0,1,2,3,4].forEach(function(n){
    var b=el("button","rirChip "+rirClass(n),n===4?"4+":String(n));
    b.onclick=function(){rir=n+(rir%1!==0?0.5:0);paintRir()}; chips.push({n:n,b:b}); row.appendChild(b);
  });
  var half=el("button","rirChip half","½");
  half.onclick=function(){var t=Math.floor(rir);rir=(rir%1!==0)?t:t+0.5;paintRir()};
  row.appendChild(half);
  function paintRir(){
    chips.forEach(function(c){c.b.className="rirChip "+rirClass(c.n)+(Math.floor(rir)===c.n?" on":"")});
    half.className="rirChip half"+(rir%1!==0?" on":"");
  }
  paintRir();

  var f4=el("div","field");
  f4.innerHTML='<div class="fLabel"><span>Not</span><span class="hint">isteğe bağlı</span></div><input class="inp" id="nIn" placeholder="sağ kol · +starting · her el…">';
  sh.appendChild(f4);
  var nIn=f4.querySelector("#nIn"); nIn.value=mevcut?(mevcut.note||""):(son?son.note||"":"");

  var btns=el("div","sheetBtns");
  if(setId){
    var dl=el("button","ghost danger","Seti sil");
    dl.onclick=function(){
      exr.sets=exr.sets.filter(function(s){return s.id!==setId});
      saveLocal(); closeSheet(); render();
    };
    btns.appendChild(dl);
  }
  var sv=el("button","primary",setId?"Güncelle":"Kaydet");
  sv.onclick=function(){
    var w=parseFloat(wIn.value), rp=parseInt(rIn.value,10)||0;
    if(isNaN(w)||rp<=0) return;
    var val={w:w,u:u,reps:rp,rir:rir,note:nIn.value.trim()};
    if(setId){ exr.sets=exr.sets.map(function(s){return s.id===setId?Object.assign({id:setId},val):s}); }
    else { exr.sets.push(Object.assign({id:uid()},val)); }
    exr.unit=u; D.defaultUnit=u;
    saveLocal(); closeSheet(); render();
  };
  btns.appendChild(sv); sh.appendChild(btns);
}

/* ---------- hareket ekle ---------- */
function addSheet(){
  var sh=openSheet("Hareket ekle");
  var inp=el("input","inp"); inp.placeholder="Ara veya kendi hareketini yaz"; sh.appendChild(inp);
  var mk=el("button","primary","Yazdığını ekle"); mk.style.display="none"; sh.appendChild(mk);
  var picker=el("div","picker"); sh.appendChild(picker);
  var g=gunu(date);
  function ekle(name){
    var gs=gecenSefer(name);
    var cur=gunu(date);
    var yeni={id:uid(),name:name,unit:gs?gs.sets[gs.sets.length-1].u:D.defaultUnit,sets:[]};
    cur.exercises=cur.exercises.concat([yeni]);
    expandedEx=yeni.id;
    D.days[date]=cur; saveLocal(); closeSheet(); render();
  }
  function draw(){
    var q=inp.value.trim().toLowerCase();
    var hepsi=[].concat(HAZIR.itis,HAZIR.cekis,HAZIR.bacak).map(function(x){return x.toLowerCase()});
    mk.style.display=(q&&hepsi.indexOf(q)<0)?"flex":"none";
    mk.textContent="“"+inp.value.trim()+"” ekle";
    picker.innerHTML="";
    var sira=g.focus?[g.focus].concat(Object.keys(HAZIR).filter(function(k){return k!==g.focus})):Object.keys(HAZIR);
    sira.forEach(function(k){
      var list=HAZIR[k].filter(function(n){return n.toLowerCase().indexOf(q)>=0});
      if(!list.length) return;
      var grp=el("div","group",'<p class="groupName">'+ODAK.filter(function(o){return o.id===k})[0].ad+"</p>");
      list.forEach(function(n){var b=el("button","pick",esc(n));b.onclick=function(){ekle(n)};grp.appendChild(b)});
      picker.appendChild(grp);
    });
  }
  mk.onclick=function(){if(inp.value.trim())ekle(inp.value.trim())};
  inp.oninput=draw; draw(); inp.focus();
}

function sonSeansiGetir(){
  var keys=Object.keys(D.days).filter(function(k){return k<date&&ozet(k).sets}).sort().reverse();
  var g=gunu(date);
  var hedef=g.focus?(keys.filter(function(k){return D.days[k].focus===g.focus})[0]||keys[0]):keys[0];
  if(!hedef) return;
  var src=D.days[hedef];
  D.days[date]={focus:g.focus||src.focus||null,
    exercises:src.exercises.filter(function(e){return e.sets.length}).map(function(e){return {id:uid(),name:e.name,unit:e.unit,sets:[]}})};
  saveLocal(); render();
}

/* ---------- geçmiş ---------- */
function historySheet(name){
  var sh=openSheet(name,"geçmiş");
  var kay=gecmis(name);
  if(!kay.length){sh.appendChild(el("p","muted pad","Bu hareket için henüz kayıt yok."));return}
  var wrap=el("div","hist");
  kay.slice(0,12).forEach(function(k){
    var d=parseD(k.tarih), h=k.sets.reduce(function(a,s){return a+toKg(s.w,s.u)*s.reps},0);
    var html='<div class="histDate"><span>'+d.getDate()+" "+AYLAR[d.getMonth()]+"</span><em>"+Math.round(h)+' kg</em></div><div class="histSets">';
    k.sets.forEach(function(s){html+='<span class="pill '+rirClass(s.rir)+'">'+fmt(s.w)+(s.u==="lbs"?"lb":"")+"×"+s.reps+"<em>"+fmt(s.rir)+"</em></span>"});
    wrap.appendChild(el("div","histRow",html+"</div>"));
  });
  sh.appendChild(wrap);
}

/* ---------- menü ---------- */
function menuSheet(){
  var t=toplam();
  var sh=openSheet("Aktar ve senkronize et",t.gun+" gün · "+t.sets+" set kayıtlı");
  var m=el("div","menu");
  function item(baslik,aciklama,fn){
    var b=el("button","menuItem","<b>"+baslik+"</b><em>"+aciklama+"</em>"); b.onclick=fn; m.appendChild(b);
  }
  item("Bulut senkronu","GitHub deposuna otomatik yaz. "+(CFG.token?"Bağlı: "+esc(CFG.owner+"/"+CFG.repo):"Kurulmadı."),cloudSheet);
  item("AI için kopyala","Şema + tüm günlük. ChatGPT, Gemini veya Claude'a yapıştır.",function(){textSheet("AI için kopyala",SEMA+"\n\n"+JSON.stringify(slim(),null,1))});
  item("JSON yapıştır","AI'ın döndürdüğü günlüğü geri al.",importSheet);
  item("Markdown kopyala","Defter biçiminde okunur metin.",function(){textSheet("Markdown",toMarkdown())});
  item("Yedek indir","antrenman-"+iso(new Date())+".json",function(){
    try{
      var blob=new Blob([JSON.stringify(D,null,1)],{type:"application/json"});
      var a=document.createElement("a"); a.href=URL.createObjectURL(blob);
      a.download="antrenman-"+iso(new Date())+".json"; a.click(); URL.revokeObjectURL(a.href);
    }catch(e){}
  });
  sh.appendChild(m);
  if(syncMsg) sh.appendChild(el("p",syncState==="err"?"hata":"muted note",esc(syncMsg)));
}

function textSheet(baslik,metin){
  var sh=openSheet(baslik);
  var ta=el("textarea","ta"); ta.rows=9; ta.readOnly=true; ta.value=metin;
  ta.onfocus=function(){ta.select()};
  sh.appendChild(ta);
  var msg=el("p","iyi"); msg.style.display="none"; sh.appendChild(msg);
  var btns=el("div","sheetBtns");
  var cp=el("button","primary","Kopyala");
  cp.onclick=function(){
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(metin).then(function(){msg.textContent="Kopyalandı.";msg.className="iyi";msg.style.display="block"})
      .catch(function(){msg.textContent="Kopyalanamadı. Kutudan seçip elle kopyala.";msg.className="hata";msg.style.display="block"});
    } else {ta.select();document.execCommand("copy");msg.textContent="Kopyalandı.";msg.style.display="block"}
  };
  var bk=el("button","ghost","Geri"); bk.onclick=menuSheet;
  btns.appendChild(cp);btns.appendChild(bk);sh.appendChild(btns);
}

function importSheet(){
  var sh=openSheet("JSON yapıştır","AI'ın döndürdüğü metni buraya koy");
  var ta=el("textarea","ta"); ta.rows=8; ta.placeholder='{"days": { "2026-09-02": { … } }}';
  sh.appendChild(ta);
  var msg=el("p","hata"); msg.style.display="none"; sh.appendChild(msg);
  var onay=false;
  function uygula(mod){
    var ham=ta.value.trim().replace(/^```(?:json)?/i,"").replace(/```$/,"").trim();
    var obj;
    try{obj=JSON.parse(ham)}catch(e){msg.textContent="Bu geçerli JSON değil. AI'dan sadece JSON döndürmesini iste.";msg.style.display="block";return}
    var gunler=hydrate(obj);
    if(!Object.keys(gunler).length){msg.textContent="İçinde tanınan bir gün yok. days alanı ve YYYY-AA-GG tarihleri olmalı.";msg.style.display="block";return}
    D.days = mod==="replace"?gunler:Object.assign({},D.days,gunler);
    saveLocal(); closeSheet(); render();
  }
  var btns=el("div","sheetBtns");
  var b1=el("button","primary","Birleştir"); b1.onclick=function(){uygula("merge")};
  var b2=el("button","ghost","Hepsini değiştir");
  b2.onclick=function(){ if(!onay){onay=true;b2.className="ghost danger";b2.textContent="Emin misin? Tüm günler silinecek";} else uygula("replace"); };
  var b3=el("button","ghost","Geri"); b3.onclick=menuSheet;
  btns.appendChild(b1);btns.appendChild(b2);btns.appendChild(b3);sh.appendChild(btns);
  sh.appendChild(el("p","muted note","Birleştir: aynı tarihli günler yenisiyle değişir, diğerleri kalır."));
}

function cloudSheet(){
  var sh=openSheet("Bulut senkronu","GitHub deposundaki bir dosyaya yazar");
  var f=el("div");
  f.innerHTML='<input class="inp" id="cOwner" placeholder="GitHub kullanıcı adın" autocapitalize="off" autocorrect="off">'
   +'<input class="inp" id="cRepo" placeholder="depo adı (ör. antrenman)" autocapitalize="off" autocorrect="off">'
   +'<input class="inp" id="cPath" placeholder="dosya yolu (log.json)" autocapitalize="off" autocorrect="off">'
   +'<input class="inp" id="cBranch" placeholder="dal (main)" autocapitalize="off" autocorrect="off">'
   +'<input class="inp" id="cToken" type="password" placeholder="fine-grained token" autocapitalize="off" autocorrect="off">';
  sh.appendChild(f);
  f.querySelector("#cOwner").value=CFG.owner; f.querySelector("#cRepo").value=CFG.repo;
  f.querySelector("#cPath").value=CFG.path; f.querySelector("#cBranch").value=CFG.branch;
  f.querySelector("#cToken").value=CFG.token;

  if(CFG.owner&&CFG.repo){
    sh.appendChild(el("p","url","https://raw.githubusercontent.com/"+esc(CFG.owner)+"/"+esc(CFG.repo)+"/"+esc(CFG.branch)+"/"+esc(CFG.path)));
  }
  var msg=el("p","muted note"); msg.textContent=syncMsg||""; sh.appendChild(msg);

  var btns=el("div","sheetBtns");
  var sv=el("button","primary","Kaydet ve bağlan");
  sv.onclick=function(){
    CFG.owner=f.querySelector("#cOwner").value.trim();
    CFG.repo=f.querySelector("#cRepo").value.trim();
    CFG.path=f.querySelector("#cPath").value.trim()||"log.json";
    CFG.branch=f.querySelector("#cBranch").value.trim()||"main";
    CFG.token=f.querySelector("#cToken").value.trim();
    saveCfg(); sha=null;
    pull(false).then(function(){msg.textContent=syncMsg;msg.className=syncState==="err"?"hata":"iyi";renderFocus()});
  };
  var pl=el("button","ghost","Buluttan çek (üzerine yaz)");
  pl.onclick=function(){pull(true).then(function(){msg.textContent=syncMsg;msg.className=syncState==="err"?"hata":"iyi"})};
  var ps=el("button","ghost","Buluta gönder");
  ps.onclick=function(){push().then(function(){msg.textContent=syncMsg;msg.className=syncState==="err"?"hata":"iyi"})};
  var dc=el("button","ghost danger","Bağlantıyı kes");
  dc.onclick=function(){CFG.token="";saveCfg();setSync("off","");closeSheet()};
  var bk=el("button","ghost","Geri"); bk.onclick=menuSheet;
  [sv,pl,ps,dc,bk].forEach(function(b){btns.appendChild(b)});
  sh.appendChild(btns);
  sh.appendChild(el("p","muted note","Token cihazda saklanır. Yalnızca bu depoya “Contents: read and write” izni olan fine-grained token kullan. Depo herkese açıksa yukarıdaki adresi ChatGPT, Gemini veya Claude'a verip günlüğü okutabilirsin."));
}

/* ---------- bağlama ---------- */
document.getElementById("menuBtn").onclick=menuSheet;
document.getElementById("prev").onclick=function(){date=shiftD(date,-1);expandedEx=null;confirmEx=null;render()};
document.getElementById("next").onclick=function(){date=shiftD(date,1);expandedEx=null;confirmEx=null;render()};
document.getElementById("dateBtn").onclick=function(){
  var i=document.getElementById("dateInput");
  if(i.showPicker) i.showPicker(); else i.click();
};
document.getElementById("dateInput").onchange=function(e){if(e.target.value){date=e.target.value;expandedEx=null;confirmEx=null;render()}};
document.addEventListener("visibilitychange",function(){if(!document.hidden)pull(false)});
window.addEventListener("keydown",function(e){if(e.key==="Escape")closeSheet()});

render();
if(CFG.token&&CFG.owner&&CFG.repo) pull(false);
</script>
